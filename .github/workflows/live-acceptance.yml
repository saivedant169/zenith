name: Live acceptance (sandbox AWS)

# Live cloud acceptance: the Zenith acceptance scenarios run against a REAL AWS
# sandbox account. A person starts it, by hand, from the Actions tab.
#
# ## Live cloud tests never run on contributor pull requests
#
# This workflow's only trigger is `workflow_dispatch`. It is not wired to
# `push`, `pull_request`, `pull_request_target`, `schedule` or `workflow_run`,
# and tests/ci/release-gates.test.ts fails CI if that ever changes or if
# `pull_request_target` appears in any workflow. `ci.yml` - the workflow that
# does run on every pull request - holds no AWS credentials, no `id-token`
# permission and no reference to this workflow's variables, and the same test
# asserts that too. A fork's pull request can therefore never obtain a role in
# the sandbox account, and never spends money in it.
#
# ## What must exist OUTSIDE this repository (not created by this change)
#
#   1. A GitHub environment named `live-sandbox` (Settings > Environments) whose
#      deployment-branch policy is restricted to protected branches (or an explicit
#      allow-list). Without that policy, anyone with write access could push a
#      branch that edits THIS file and dispatch it from there; the environment
#      rule is what refuses that run, and it is the one GitHub setting that stops
#      a branch from minting a token.
#      The environment has NO required reviewer. Owner decision 2026-10-26
#      (delegated automated approval; see docs/build/production/LIVE-ACCEPTANCE.md,
#      "Owner decision (2026-10-26)"). The gates that remain, in order, are:
#        - the protected-branch deployment policy above, before any credential;
#        - the per-run envelope in LIVE_SANDBOX_AWS_PERMISSIONS_JSON, bound to the
#          plan SHA-256, source commit, account, region, USD ceiling and duration,
#          checked by scripts/acceptance/live/preflight.ts before OIDC;
#        - the root scope approval in LIVE_SANDBOX_SCOPE_JSON (sandbox account and
#          regions, per-run budget ceiling, expiry), checked before any cloud call.
#      Optionally a wait timer. Environment variables (not secrets - nothing
#      here is secret; see below): LIVE_SANDBOX_AWS_ROLE_ARN,
#      LIVE_SANDBOX_AWS_ACCOUNT_ID and, optionally, LIVE_SANDBOX_AWS_REGION
#      (default ap-south-1).
#
#   2. In the sandbox AWS account: the IAM OIDC identity provider for
#      https://token.actions.githubusercontent.com (audience sts.amazonaws.com)
#      and a role whose trust policy requires BOTH
#        token.actions.githubusercontent.com:aud = sts.amazonaws.com
#        token.actions.githubusercontent.com:sub = repo:<owner>/<repo>:environment:live-sandbox
#      (<owner>/<repo> is the repository running this workflow; main.tf github_repository)
#      (GitHub puts the environment name in `sub` when the job uses one, so the
#      role can only be assumed by a job that passed the environment's
#      protection rules). Give the role a permissions policy scoped to what the
#      scenarios create, a permissions boundary, and a one-hour maximum session.
#      Do not reuse a role from any account that holds real workloads.
#
#   3. A clean committed candidate, an owner-approved exact permissions.json
#      awsLive envelope in LIVE_SANDBOX_AWS_PERMISSIONS_JSON, private DB bootstrap
#      outputs, and approved provisional regional costs. The production harness
#      performs bounded AWS fixtures; full product journeys remain pending until
#      the Wave 5 ProductScenarioPort is joined. Incomplete acceptance fails.
#
# ## Scenario runs start the Zenith stack before OIDC
#
# The `scenario` input selects what the harness proves. `fixtures` (default) is
# the bounded AWS fixture run above and starts nothing on the runner. `rel-04`
# is the PROD-REL-04 crash-and-resume drill (S3 only, no stack): after OIDC it
# runs scripts/acceptance/live/drill/rel-04.ts instead of the plain harness and
# recovery steps, then the offline verifier, then an always-run recovery of any open
# rel-04 journal, and the final gate requires the drill, the verifier and that recovery to succeed. `retention-s3` and `mix-03` first start the lean Zenith stack on this hosted
# runner, with the same profile and disk freeing as operated-gate-linux.yml, and
# only then requests the OIDC session, so the stack never consumes the one-hour
# AWS session. The stack's platform database URL and the ZENITH_LIVE_PRODUCT*
# variables are exported for the harness. The stack is torn down with
# `if: always()` before the final gate; a teardown failure is a visible warning
# and never changes the acceptance result. The job timeout is 90 minutes for this
# reason; the AWS session stays one hour. Stack steps use no new actions.
#
# ## No long-lived credentials
#
# There is no access key, no secret and no stored token anywhere in this file or
# in the repository settings it relies on. The job authenticates with GitHub's
# OIDC token (`permissions: id-token: write`) through the official
# aws-actions/configure-aws-credentials action, pinned by commit SHA, and gets
# short-lived session credentials that expire with the run. The role ARN is a
# repository/environment VARIABLE, not a secret: an ARN is an identifier, and
# what protects the role is its trust policy, not the secrecy of its name.
#
# ## Honest status
#
# No live dispatch or cloud acceptance is claimed: DEC-CLOUD is still deferred.
# What IS checked on every pull request is that
# it parses under actionlint and that its shape (dispatch-only, environment,
# id-token, pinned SHAs, guards) is what this comment says.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID from the owner-approved plan (zlive-YYYYMMDDHHmm-xxxx)'
        required: true
        type: string
      budget_usd:
        description: 'Explicit USD ceiling including cleanup reserve, approved by DEC-CLOUD'
        required: true
        type: string
      minutes:
        description: 'Run time limit in minutes, an integer from 5 to 20 (default 15). Bound into the signed envelope: it must match the plan the owner approved.'
        required: false
        default: '15'
        type: string
      scenario:
        description: 'fixtures (default: every AWS fixture family), retention-s3 (starts the Zenith stack before OIDC; PROD-OPS-07 only), rel-04 (PROD-REL-04 crash-and-resume drill; S3 only, no stack) or mix-03 (starts the Zenith stack before OIDC). Bound into the signed envelope.'
        required: false
        default: fixtures
        type: choice
        options:
          - fixtures
          - retention-s3
          - rel-04
          - mix-03

# Source read only at the workflow level; the one job that needs more asks for
# it below.
permissions:
  contents: read

# One live run at a time. Two runs would create and destroy resources in the
# same sandbox account at once, and a cancelled run would leave its resources
# behind - so never cancel one in progress.
concurrency:
  group: live-acceptance
  cancel-in-progress: false

jobs:
  aws-live:
    runs-on: ubuntu-24.04
    # Owner-approved 90 minutes (docs/build/production/AWS-PRODUCT-HOOK-DESIGN-2026-10-25.md,
    # section 1): a scenario run starts the Zenith stack before the one-hour OIDC session.
    timeout-minutes: 90
    # Pauses here for the environment's reviewers, and scopes `vars` to it.
    environment: live-sandbox

    permissions:
      contents: read
      # Lets this job request a GitHub OIDC token. It is what
      # configure-aws-credentials exchanges for AWS session credentials.
      id-token: write

    env:
      LIVE_SANDBOX_AWS_ROLE_ARN: ${{ vars.LIVE_SANDBOX_AWS_ROLE_ARN }}
      LIVE_SANDBOX_AWS_ACCOUNT_ID: ${{ vars.LIVE_SANDBOX_AWS_ACCOUNT_ID }}
      ZENITH_LIVE_AWS: '1'
      ZENITH_LIVE_AWS_ENVIRONMENT: live-sandbox
      ZENITH_LIVE_AWS_ACCOUNT_ID: ${{ vars.LIVE_SANDBOX_AWS_ACCOUNT_ID }}
      ZENITH_LIVE_REGION: ${{ vars.LIVE_SANDBOX_AWS_REGION || 'ap-south-1' }}
      ZENITH_LIVE_AWS_RUN_ID: ${{ inputs.run_id }}
      ZENITH_LIVE_AWS_BUDGET_USD: ${{ inputs.budget_usd }}
      # Read by the envelope preflight, the harness, the rel-04 drill and recovery. Validated before OIDC.
      ZENITH_LIVE_AWS_MINUTES: ${{ inputs.minutes }}
      ZENITH_LIVE_AWS_DB_SUBNET_GROUP: ${{ vars.LIVE_SANDBOX_AWS_DB_SUBNET_GROUP }}
      ZENITH_LIVE_AWS_DB_SECURITY_GROUP: ${{ vars.LIVE_SANDBOX_AWS_DB_SECURITY_GROUP }}
      # Read by the envelope preflight (it binds the scenario) and by the harness.
      ZENITH_LIVE_AWS_SCENARIO: ${{ inputs.scenario }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Fail if the acceptance script does not exist yet
        # Not a skip: see "No long-lived credentials" above. Checked before any
        # credential is requested.
        if: hashFiles('scripts/acceptance/aws-live.ts') == ''
        shell: bash
        run: |
          echo "::error::scripts/acceptance/aws-live.ts does not exist yet (it belongs to the live-acceptance workstream), so there is nothing to run against the sandbox account."
          exit 1

      - name: Set owned live acceptance paths
        if: hashFiles('scripts/acceptance/aws-live.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          {
            # shortcut: hosted runners keep no state, so this ledger only covers one run; the per-run envelope, root per-run cap and the AWS budget alarm bound spend. Upgrade to a persisted ledger before running several live jobs in parallel.
            echo "ZENITH_LIVE_BUDGET_FILE=$RUNNER_TEMP/zenith-live-budget/ledger.json"
            echo "ZENITH_LIVE_AWS_PERMISSIONS=$RUNNER_TEMP/zenith-aws-permissions.json"
            echo "ZENITH_LIVE_SCOPE_FILE=$RUNNER_TEMP/zenith-live-scope.json"
            echo "ZENITH_LIVE_AWS_OUT=$RUNNER_TEMP/zenith-aws-production"
          } >> "$GITHUB_ENV"

      - name: Check the sandbox account configuration
        if: hashFiles('scripts/acceptance/aws-live.ts') != ''
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LIVE_SANDBOX_AWS_ROLE_ARN:-}" ] || [ -z "${LIVE_SANDBOX_AWS_ACCOUNT_ID:-}" ]; then
            echo "::error::LIVE_SANDBOX_AWS_ROLE_ARN and LIVE_SANDBOX_AWS_ACCOUNT_ID must both be set as variables on the live-sandbox environment."
            exit 1
          fi
          case "$LIVE_SANDBOX_AWS_ACCOUNT_ID" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *)
              echo "::error::LIVE_SANDBOX_AWS_ACCOUNT_ID must be a 12-digit AWS account id."
              exit 1
              ;;
          esac
          # The CLI accepts 5..20 minutes (scripts/acceptance/live/plan.ts); anything else is refused before any plan is built.
          case "$ZENITH_LIVE_AWS_MINUTES" in
            [5-9]|1[0-9]|20) ;;
            *)
              echo "::error::minutes must be an integer from 5 to 20."
              exit 1
              ;;
          esac
          # The role must live in the account declared as the sandbox. The action
          # below also refuses credentials for any other account; this catches a
          # copy-paste of the wrong ARN before an OIDC token is requested at all.
          case "$LIVE_SANDBOX_AWS_ROLE_ARN" in
            "arn:aws:iam::${LIVE_SANDBOX_AWS_ACCOUNT_ID}:role/"*) ;;
            *)
              echo "::error::LIVE_SANDBOX_AWS_ROLE_ARN is not a role in account ${LIVE_SANDBOX_AWS_ACCOUNT_ID}."
              exit 1
              ;;
          esac

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('scripts/acceptance/aws-live.ts') != ''
        with:
          node-version: '22.23.3'
          cache: npm

      # Installed BEFORE any AWS credential exists, so no dependency code runs in
      # a process that could read one (and `--ignore-scripts` means none runs at
      # install time anyway).
      - name: Install dependencies
        if: hashFiles('scripts/acceptance/aws-live.ts') != ''
        run: npm ci --ignore-scripts

      - name: Validate the approved permission envelope before OIDC
        if: hashFiles('scripts/acceptance/aws-live.ts') != ''
        env:
          PERMISSIONS_JSON: ${{ vars.LIVE_SANDBOX_AWS_PERMISSIONS_JSON }}
          SCOPE_JSON: ${{ vars.LIVE_SANDBOX_SCOPE_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PERMISSIONS_JSON"
          test -n "$SCOPE_JSON"
          printf '%s\n' "$PERMISSIONS_JSON" > "$ZENITH_LIVE_AWS_PERMISSIONS"
          chmod 600 "$ZENITH_LIVE_AWS_PERMISSIONS"
          printf '%s\n' "$SCOPE_JSON" > "$ZENITH_LIVE_SCOPE_FILE"
          chmod 600 "$ZENITH_LIVE_SCOPE_FILE"
          npx tsx scripts/acceptance/live/preflight.ts

      # Scenario runs only. The Zenith stack starts on this runner BEFORE the OIDC
      # step, so no AWS credential exists while it is installed and started.
      - name: Free runner disk for the Zenith stack
        if: hashFiles('scripts/acceptance/aws-live.ts') != '' && contains(fromJSON('["retention-s3","mix-03"]'), inputs.scenario)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Install the pinned Supabase CLI
        if: hashFiles('scripts/acceptance/aws-live.ts') != '' && contains(fromJSON('["retention-s3","mix-03"]'), inputs.scenario)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 15 --max-time 120 --output supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.75.0/supabase_linux_amd64.tar.gz
          # Official supabase_2.75.0_checksums.txt.
          printf '%s  %s\n' 'e5597462f865d5ac72af0453358e37ecb0d85962ad6914a114a53de847303bde' 'supabase.tar.gz' | sha256sum --check --strict
          tar -xzf supabase.tar.gz -C "$RUNNER_TEMP/bin" supabase
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Start the Zenith stack and verify readiness before OIDC
        # Same lean profile and host environment as operated-gate-linux.yml.
        if: hashFiles('scripts/acceptance/aws-live.ts') != '' && contains(fromJSON('["retention-s3","mix-03"]'), inputs.scenario)
        env:
          REGISTRY_IMAGE: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          umask 077
          # Private root for the stack, its TMPDIR and the host environment file.
          mkdir -m 700 "$RUNNER_TEMP/zenith" "$RUNNER_TEMP/zenith/tmp"
          ZENITH_ACCEPTANCE_DEFAULT_STACK=1 TMPDIR="$RUNNER_TEMP/zenith/tmp" ZENITH_DEFAULT_STACK_REGISTRY_IMAGE="$REGISTRY_IMAGE" \
            node scripts/acceptance/default-stack/up.mjs --profile lean --directory "$RUNNER_TEMP/zenith/stack"
          # up.mjs fails unless readiness passes; re-check the receipt it wrote.
          node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (r.failed !== 0 || !(r.passed > 0)) process.exit(1)' "$RUNNER_TEMP/zenith/stack/readiness.receipt.json"
          host_env="$RUNNER_TEMP/zenith/host.env"
          ZENITH_ACCEPTANCE_DEFAULT_STACK=1 node scripts/acceptance/default-stack/env.mjs "$RUNNER_TEMP/zenith/stack" "$host_env"
          trap 'rm -f -- "$host_env"' EXIT
          # Public repository: mask every value before later steps can echo their env.
          while IFS='=' read -r key value; do
            if [ "${#value}" -ge 8 ]; then echo "::add-mask::$value"; fi
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            # The platform database the harness reaches: the stack's pooler URL, as the app uses it.
            if [ "$key" = ZENITH_PLATFORM_DB_URL ]; then printf 'ZENITH_LIVE_PRODUCT_DATABASE_URL=%s\n' "$value" >> "$GITHUB_ENV"; fi
          done < "$host_env"
          {
            echo "ZENITH_LIVE_PRODUCT=1"
            echo "ZENITH_LIVE_PRODUCT_DIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Assume the sandbox role through GitHub OIDC
        if: hashFiles('scripts/acceptance/aws-live.ts') != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.LIVE_SANDBOX_AWS_ROLE_ARN }}
          aws-region: ${{ vars.LIVE_SANDBOX_AWS_REGION || 'ap-south-1' }}
          # Refuse credentials for any account but the declared sandbox.
          allowed-account-ids: ${{ vars.LIVE_SANDBOX_AWS_ACCOUNT_ID }}
          role-session-name: zenith-live-acceptance-${{ github.run_id }}
          # Matches the role's one-hour maximum session. The job timeout is longer
          # only because the Zenith stack starts before this session (see the header).
          role-duration-seconds: 3600

      - name: Live acceptance against the sandbox account
        id: acceptance
        if: hashFiles('scripts/acceptance/aws-live.ts') != '' && inputs.scenario != 'rel-04'
        # The final step remains a hard gate. Continuing here permits owned
        # recovery and artifact publication after failure; it never makes it green.
        continue-on-error: true
        # The harness journals intents/counters, finalizes and attempts owned
        # teardown. Recovery below cannot erase a failed original acceptance.
        run: npx tsx scripts/acceptance/aws-live.ts

      - name: Recover an incomplete owned journal
        id: recovery
        if: hashFiles('scripts/acceptance/aws-live.ts') != '' && inputs.scenario != 'rel-04'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          journal="${RUNNER_TEMP}/zenith-aws-production/${ZENITH_LIVE_AWS_RUN_ID}/journal.json"
          if [ -f "$journal" ]; then
            if node -e 'const fs=require("node:fs"); process.exit(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).closed ? 0 : 1)' "$journal"; then
              echo "Owned journal already closed; no recovery cloud calls."
            else
              npx tsx scripts/acceptance/aws-live.ts --cleanup "$journal"
            fi
          fi

      - name: Publish sanitized AWS evidence and recovery journal
        if: hashFiles('scripts/acceptance/aws-live.ts') != '' && inputs.scenario != 'rel-04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-live-${{ github.run_id }}
          path: ${{ runner.temp }}/zenith-aws-production/${{ inputs.run_id }}/*.json
          if-no-files-found: error
          retention-days: 7

      # Scenario rel-04 only. The drill is continue-on-error so its receipt, journals
      # and the verifier still run and publish after a failed step; the final gate
      # reads both outcomes and refuses unless the drill and the verifier passed.
      - name: Run the PROD-REL-04 crash-and-resume drill
        id: drill
        if: hashFiles('scripts/acceptance/aws-live.ts') != '' && inputs.scenario == 'rel-04'
        continue-on-error: true
        run: npx tsx scripts/acceptance/live/drill/rel-04.ts

      - name: Verify the PROD-REL-04 receipt offline
        # No AWS call: re-derives every step from the journals, checkpoints, evidence
        # and permission file on disk, and compares them with the receipt.
        id: verify
        if: always() && hashFiles('scripts/acceptance/aws-live.ts') != '' && inputs.scenario == 'rel-04'
        continue-on-error: true
        run: npx tsx scripts/acceptance/live/drill/verify-rel-04.ts --run-id "$ZENITH_LIVE_AWS_RUN_ID" --out "$ZENITH_LIVE_AWS_OUT" --permissions "$ZENITH_LIVE_AWS_PERMISSIONS"

      - name: Recover any open rel-04 journal (drill directories D1 and D2)
        # Runs whatever the drill did: a leak must never depend on the drill succeeding.
        # Each rel-04 journal that is not closed gets the same journal-only cleanup as the
        # fixtures and retention-s3 recovery step. This step never changes the drill verdict;
        # the final gate reads its outcome and refuses unless it succeeded.
        id: recovery_rel04
        if: always() && hashFiles('scripts/acceptance/aws-live.ts') != '' && inputs.scenario == 'rel-04'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for journal in \
            "${RUNNER_TEMP}/zenith-aws-production/${ZENITH_LIVE_AWS_RUN_ID}/journal.json" \
            "${RUNNER_TEMP}/zenith-aws-production-replay/${ZENITH_LIVE_AWS_RUN_ID}/journal.json"; do
            [ -f "$journal" ] || continue
            if node -e 'const fs=require("node:fs"); process.exit(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).closed ? 0 : 1)' "$journal"; then
              echo "Owned journal already closed; no recovery cloud calls: $journal"
              continue
            fi
            npx tsx scripts/acceptance/aws-live.ts --cleanup "$journal" || status=1
          done
          exit "$status"

      - name: Publish PROD-REL-04 drill journals, evidence and receipt
        if: hashFiles('scripts/acceptance/aws-live.ts') != '' && inputs.scenario == 'rel-04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-live-rel04-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/zenith-aws-production/${{ inputs.run_id }}/*.json
            ${{ runner.temp }}/zenith-aws-production-replay/${{ inputs.run_id }}/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Tear down the Zenith stack
        # Runs after success and failure alike. A failure here is a visible warning
        # and never changes the acceptance outcome the final gate reads.
        if: always() && hashFiles('scripts/acceptance/aws-live.ts') != '' && contains(fromJSON('["retention-s3","mix-03"]'), inputs.scenario)
        run: |
          set -uo pipefail
          stack="$RUNNER_TEMP/zenith/stack"
          if [ ! -f "$stack/state.json" ]; then
            echo "No owned Zenith stack was started; nothing to tear down."
            exit 0
          fi
          if ZENITH_ACCEPTANCE_DEFAULT_STACK=1 TMPDIR="$RUNNER_TEMP/zenith/tmp" node scripts/acceptance/default-stack/down.mjs "$stack"; then
            rm -rf -- "$RUNNER_TEMP/zenith"
          else
            echo "::warning::Zenith stack teardown failed. Owned containers, network or volumes may remain on this runner. The acceptance outcome is unchanged."
          fi

      - name: Require complete acceptance and successful cleanup
        if: hashFiles('scripts/acceptance/aws-live.ts') != ''
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
          DRILL_OUTCOME: ${{ steps.drill.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REL04_RECOVERY_OUTCOME: ${{ steps.recovery_rel04.outcome }}
        run: |
          set -euo pipefail
          if [ "$ZENITH_LIVE_AWS_SCENARIO" = rel-04 ]; then
            # The drill's own verdict, the offline verifier over its disk evidence and the
            # rel-04 recovery of any open journal must all succeed.
            test "$DRILL_OUTCOME" = success
            test "$VERIFY_OUTCOME" = success
            test "$REL04_RECOVERY_OUTCOME" = success
          else
            test "$ACCEPTANCE_OUTCOME" = success
            test "$RECOVERY_OUTCOME" = success
          fi
